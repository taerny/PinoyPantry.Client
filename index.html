
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/png" href="/images/logo.png" />
      <title>PinoyPantry - Authentic Filipino Products</title>

      <!-- SEO: description is what Google shows under the title in search results -->
      <meta name="description" content="Authentic Filipino groceries in Dunedin, New Zealand. Canned goods, snacks, instant noodles, condiments and more — shop online or visit us in-store. Proudly Filipino-owned." />
      <link rel="canonical" href="https://pinoypantry.co.nz/" />

      <!-- Open Graph / Facebook & Messenger link previews -->
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://pinoypantry.co.nz/" />
      <meta property="og:title" content="PinoyPantry - Authentic Filipino Products" />
      <meta property="og:description" content="Authentic Filipino groceries in Dunedin, New Zealand. Canned goods, snacks, instant noodles, condiments and more — shop online or visit us in-store." />
      <meta property="og:image" content="https://pinoypantry.co.nz/images/logo.png" />

      <!-- Twitter/X card -->
      <meta name="twitter:card" content="summary" />
      <meta name="twitter:title" content="PinoyPantry - Authentic Filipino Products" />
      <meta name="twitter:description" content="Authentic Filipino groceries in Dunedin, New Zealand. Shop online or visit us in-store." />
      <meta name="twitter:image" content="https://pinoypantry.co.nz/images/logo.png" />

      <!-- Structured data: tells Google this is a real local grocery store (address, hours-type
           info) - can surface richer results and helps local "near me" style searches. -->
      <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "GroceryStore",
          "name": "PinoyPantry",
          "description": "Authentic Filipino groceries in Dunedin, New Zealand.",
          "url": "https://pinoypantry.co.nz/",
          "image": "https://pinoypantry.co.nz/images/logo.png",
          "telephone": "+64210361792",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "9 Ryehill St, Calton Hill",
            "addressLocality": "Dunedin",
            "addressCountry": "NZ"
          }
        }
      </script>

      <!-- Google Fonts - Poppins (body) + Baloo 2 (headings, matches logo's bold bubble lettering) -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
